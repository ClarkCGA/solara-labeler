services:
  solara:
    build: .
    volumes:
      - /workspace/Denys/solar/solara-labeler/:/home/jovyan/solara-labeler
      - /workspace/Denys/solar/data/:/home/jovyan/solara-labeler/src/public/
    deploy:
      replicas: 2 # Adjust to the number of CPU cores you want to use
    networks:
      - solara-net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /workspace/Denys/solar/data/:/usr/share/nginx/html/public:ro # Add this line
    ports:
      - "8600:80" # Map host port 8600 to Nginx's port 80
    depends_on:
      - solara
    networks:
      - solara-net

networks:
  solara-net:
    driver: bridge