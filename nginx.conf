events {}

http {
    upstream solara_app {
        # Docker Compose will create DNS records for each replica
        # e.g., solara-labeler_solara_1, solara-labeler_solara_2, etc.
        # We can use the service name and Docker's DNS will round-robin.
        server solara:8765;
    }

    server {
        listen 80;

        location /static/public/ {
            alias /usr/share/nginx/html/public/;
            expires 30d;
            access_log off;
        }
        
        location / {
            proxy_pass http://solara_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}